[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
    max = ""
  [[module.mounts]]
    source = "dist"
    target = "assets/js/modules/leaflet"
    includeFiles = "leaflet.js"
  # Leaflet's own stylesheet, vendored by the postinstall script. It is mounted beside
  # assets/scss/leaflet.scss, which imports it and adds the module's own styles.
  [[module.mounts]]
    source = "dist/leaflet.scss"
    target = "assets/scss/leaflet-vendor.scss"
  [[module.mounts]]
    source = "dist/images"
    target = "static/css/images"
    includeFiles = "*.png"
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.imports]]
    path = "github.com/gethinode/mod-utils/v6"

[params.modules.leaflet]
  integration = "optional"

[params.modules.leaflet.csp]
  img-src = ["tile.openstreetmap.org"]
